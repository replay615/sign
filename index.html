<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{color-scheme:only light;--brand:#1d4e5f;--ink:#17212b;--mute:#66727c;--line:#d5dbd8;--bg:#eef1ef;--bad:#b3402f;--tint:color-mix(in srgb,var(--brand) 9%,#fff)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.55 Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,#fff);outline-offset:2px}
h2{font-size:21px;line-height:1.35;margin:26px 0 14px;letter-spacing:-.01em}
h2 small{font-size:14px;color:var(--mute);font-weight:500}
h3{font-size:16px;margin:22px 0 8px}
small{color:var(--mute);font-size:13px}
.mute{color:var(--mute);margin:4px 0 12px}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}
.wrap.wide{max-width:960px}
main.wrap{padding-bottom:20px}
.top{background:var(--brand);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 18px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:48px;width:auto;flex:none}
.top .org{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.top .sub{opacity:.85;margin-top:2px;font-size:14px}
.clock{flex:none;text-align:right;line-height:1.35;white-space:nowrap}
.clock .cd{font-size:12.5px;opacity:.92}
.clock .ct{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:380px){.top .org{font-size:18px}.logo{height:40px}.clock .cd{font-size:11.5px}.clock .ct{font-size:13.5px}}
.caution{background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:13.5px;line-height:1.65;white-space:pre-line;color:#5c4400}
.err{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:14px}
.maker{margin:0 0 6px;font-size:13px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.maker a{color:var(--brand);font-weight:600}
.maker a.mail{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--tint);text-decoration:none}
.srow{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.who{flex:1;min-width:0}
.who b{display:block}
.who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:12px;color:var(--mute);white-space:nowrap;text-align:right}
.srow .lnk{margin:0;padding:6px 4px}
.chip b{font-weight:600}
.rtag{background:var(--tint);color:var(--brand);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow select{width:116px;margin:0;padding:9px 8px;flex:none}
.rlist{max-height:52vh;overflow:auto;margin:8px 0}
.chip small{color:var(--mute)}
.notice{background:var(--tint);border-bottom:1px solid var(--line);padding:12px 0;font-size:14px;white-space:pre-line}
.demo{background:#fff3cd;color:#5c4400;font-size:13px;text-align:center;padding:6px}
.foot{padding-top:6px;padding-bottom:calc(30px + env(safe-area-inset-bottom));text-align:center}
.lnk{background:none;border:0;padding:6px;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px}
.lnk.back{color:var(--brand);text-decoration:none;font-size:14px;margin:16px 0 0 -6px}
.lnk.bad{color:var(--bad);display:block;margin:14px auto 0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;text-align:center}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ledger{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;background:#fff;border:0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row small{display:block}
.row>span{flex:1;min-width:0}
.row em{font-style:normal;font-size:13px;color:var(--mute);text-align:right;white-space:nowrap;flex:none}
.row em.go{color:var(--brand);font-weight:700}
.row em.done{color:#2b7a4b;font-weight:600;white-space:nowrap;max-width:none;flex:none}
.row:disabled{cursor:default;background:#f7f8f7}
.row:disabled b{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 0;line-height:1.7}
.sel{border-left:4px solid var(--brand);padding:2px 0 2px 12px;margin:18px 0 6px}
.sel small{display:block}
.sel b{font-size:18px}
.fld{display:block;margin:16px 0 0;font-weight:600;font-size:14px}
.fld small{font-weight:400}
.in,select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #b9c2be;border-radius:10px;background:#fff;font-weight:400}
textarea.in{resize:vertical}
input[type=color]{display:block;margin-top:6px;width:64px;height:40px;border:1px solid #b9c2be;border-radius:8px;padding:2px;background:#fff}
#goSign{margin-top:26px}
.padbox{position:relative;height:250px;background:#fff;border:1.5px solid var(--ink);border-radius:4px;margin:16px 0 0}
.padbox canvas{display:block;width:100%;height:100%;touch-action:none}
.padbox::before{content:'×';position:absolute;left:14px;bottom:62px;font-size:22px;line-height:1;color:var(--mute);pointer-events:none}
.padbox i{position:absolute;left:14px;right:14px;bottom:62px;border-top:1px solid #9aa6a1;pointer-events:none}
.padbox .hint{position:absolute;inset:0;display:grid;place-items:center;color:#9aa6a1;pointer-events:none;padding-bottom:40px}
.ok{width:76px;height:76px;margin:46px auto 8px;display:block}
.center{text-align:center}
.center h2{margin-top:6px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.box .fld:first-child{margin-top:0}
.box .btn{margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.seg label{display:flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:500;cursor:pointer}
.seg.col{flex-direction:column;align-items:stretch}
.seg.col label{border-radius:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:500}
.grp{margin:12px 0}
.grp>b{display:block;font-size:14px;color:var(--brand);margin-bottom:2px}
.grp .chk{display:inline-flex;margin-right:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:14px}
.chip button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:0 2px}
.warn{background:#fdecea;color:#7a2216;border:1px solid #f0b7ae;border-radius:10px;padding:10px 14px;margin-top:16px;font-size:14px}
.stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;margin:4px 0 8px}
.stat b{font-size:30px;color:var(--brand)}
.stat span{color:var(--mute)}
.stat .btn{margin-left:auto}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px}
.tbl td{padding:6px 10px;border-top:1px solid var(--line);font-size:14px}
.thumb{height:34px;display:block}
.abar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:2;padding-top:env(safe-area-inset-top)}
.abar .arow{padding:10px 0 2px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.apage{padding-bottom:60px}
#admin{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20}
.qrbox{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px}
#qr img,#qr canvas{display:block}
.mask{position:fixed;inset:0;background:rgba(15,25,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
.modal.wide{max-width:900px}
.modal h3{margin-top:0;font-size:18px}
@media(min-width:600px){.mask{align-items:center}.modal{border-radius:14px}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.prev{background:#cfd6d3;padding:12px;overflow:auto;max-height:62vh;border-radius:8px}
.boot{text-align:center;color:var(--mute);padding:90px 0}
/* 서명등록부 (화면 미리보기 + A4 인쇄 공용) — 페이지마다 같은 머리글, 왼쪽 위→아래 다음 오른쪽 위→아래, 하단에 학교 이름 */
.sheet{color:#000;font-family:Pretendard,"Malgun Gothic",sans-serif;--rh:10.5mm}
.sheet.cols3{--rh:10mm}
.page{position:relative;background:#fff;width:210mm;height:296mm;padding:16mm 12mm 20mm;box-sizing:border-box;overflow:hidden;margin:0 auto 8px;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.ph{height:14mm}
.ph h2{font-size:18pt;text-align:center;margin:0;line-height:1.3;letter-spacing:0}
.info{height:16mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5pt;line-height:1.5;padding-bottom:1.5mm}
.info .l{font-size:10pt}
.info .l{flex:1}
.info .r{flex:none;display:flex;flex-direction:column;gap:.8mm;text-align:left;white-space:nowrap}
.info .kv{display:flex;align-items:center;gap:2.5mm}
.info .k{display:inline-flex;align-items:center;gap:1.6mm;min-width:18mm;font-weight:700}
.info .k svg{width:4.6mm;height:4.6mm;flex:none}
.pf{position:absolute;left:12mm;right:12mm;bottom:6mm;display:flex;align-items:center;justify-content:center}
.pf .sch{display:flex;align-items:center;gap:3mm;font-size:17pt;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pf .sch img{height:11mm;width:auto}
.pf .pn{position:absolute;right:0;font-size:9pt;color:#555}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th,.sheet td{border:.3mm solid #000;padding:0 1mm;height:var(--rh);font-size:10pt;text-align:center;overflow:hidden;line-height:1.15}
.sheet th{height:8mm;background:#eee;font-weight:600}
.sheet .n{width:8mm;font-size:8.5pt;color:#444}
.sheet .m{width:28mm}.sheet .d{width:50mm;white-space:nowrap}
.sheet td.d.long{font-size:8pt;letter-spacing:-.02em}
.sheet.cols2 .m{width:18mm}.sheet.cols2 .d{width:32mm}
.sheet th.n{white-space:nowrap;font-size:8pt;padding:0}
.sheet.cols3 .n{width:8.5mm}.sheet.cols3 .m{width:14mm}.sheet.cols3 .d{width:24mm}
.sheet.cols3 td.d.long{font-size:7.5pt}
.sheet.cols3 td{font-size:9pt}
.sheet .sg img{max-width:100%;max-height:8.5mm;display:block;margin:0 auto}
.sheet td.rs{font-size:10pt;font-weight:600;color:#222}
.sheet.cols3 td.rs{font-size:8.5pt}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
}
</style>
</head>

/* ───── 통신 ───── */
async function api(action, data = {}) {
  if (DEMO) return demo(action, data);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, ...data }) });
    return await r.json();
  } catch (e) {
    return { ok: false, err: 'net', msg: '서버에 연결할 수 없어요. 인터넷 연결과 배포 URL을 확인해 주세요.' };
  }
}

/* ───── 공통 UI ───── */
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
function view(h) { $('#app').innerHTML = h; scrollTo(0, 0); tick(); }
function modal(h, wide) { $('#modal').innerHTML = `<div class="mask" data-act="mMask"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${h}</div></div>`; document.body.classList.add('lock'); }
function closeModal() { $('#modal').innerHTML = ''; if ($('#admin').hidden) document.body.classList.remove('lock'); }
function applyTheme() {
  document.documentElement.style.setProperty('--brand', S.cfg.color || '#1d4e5f');
  document.title = (S.cfg.org ? S.cfg.org + ' · ' : '') + '연수 전자서명';
}
function shell(inner) {
  return `${DEMO ? '<div class="demo">데모 모드 · 이 브라우저에만 저장돼요 <button class="lnk" data-act="demoOff">끝내기</button></div>' : ''}
  ${topbar(S.cfg.org || '연수 전자서명', S.cfg.sub || '연수 참여 전자서명')}
  ${S.cfg.notice ? `<div class="notice"><div class="wrap">${esc(S.cfg.notice)}</div></div>` : ''}
  <main class="wrap">${inner}</main>
  <footer class="wrap foot"><p class="maker">문의 <a class="mail" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=replay615@gmail.com&amp;su=%5B%EC%97%B0%EC%88%98%20%EC%A0%84%EC%9E%90%EC%84%9C%EB%AA%85%5D%20%EB%AC%B8%EC%9D%98" target="_blank" rel="noopener" aria-label="메일로 문의하기" title="메일로 문의하기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></svg></a></p>${TOKEN ? '' : '<button class="lnk" data-act="adminLogin">관리자</button>'}</footer>`;
}

/* ───── 구성원 화면 ───── */
async function start() {
  if (!API && !DEMO) return renderSetup();
  view('<div class="boot">불러오는 중…</div>');
  const mine = {}; // 이 기기에서 서명한 기록 (서명 번호만 보내서, 관리자가 지웠는지 확인해요)
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('esign_done_')) mine[k.slice(11)] = localStorage.getItem(k); }
  const r = await api('init', { token: TOKEN, mine });
  if (!r.ok) return view(shell(`<p class="empty">${esc(r.msg || '불러오지 못했어요.')}</p><button class="btn" data-act="retry">다시 시도</button>`));
  S.cfg = r.cfg; applyTheme();
  if (!r.tokenOk) return view(shell(`<div class="center"><h2>이 QR/링크는 만료됐어요</h2><p class="mute">이 기관은 미참석자의 원격 서명을 막기 위해<br>공유 QR/링크를 매일 새로 만들어요.<br>오늘 새로 공유된 QR로 다시 접속해 주세요.</p></div>`));
  S.trainings = r.trainings.map(normT); S.members = []; renderPick();
}
function renderSetup() {
  view(`${topbar('연수 전자서명', 'QR 찍고, 서명하면 끝')}
  <main class="wrap"><h2>시스템 연결이 필요해요</h2>
  <p class="mute">관리자에게 받은 접속 링크로 들어오시거나, 아래에 웹 앱 배포 URL을 입력해 주세요.</p>
  <label class="fld">배포 URL<input class="in" id="apiu" placeholder="https://script.google.com/macros/s/…/exec"></label>

  padInit();

function padInit() {
  const c = $('#pad'), dpr = Math.min(devicePixelRatio || 1, 2), r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr); g.lineWidth = 2.8; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#111';
  const paper = () => { g.fillStyle = '#fff'; g.fillRect(0, 0, r.width, r.height); }; // 서명판 자체를 흰색으로 칠해서, 어두운 화면 모드에서도 검은 글씨가 보여요
  paper();
  let down = false, last = [0, 0], n = 0;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => {
    e.preventDefault(); c.setPointerCapture(e.pointerId); down = true; last = pos(e);
    g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(last[0] + .1, last[1] + .1); g.stroke(); n++;
    $('#hint').hidden = true;
  };
  c.onpointermove = e => { if (!down) return; const p = pos(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; n++; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
  pad = {
    empty: () => n < 8,
    clear() { paper(); n = 0; $('#hint').hidden = false; },
    data() {
      for (const w of [360, 260, 180]) {
        const o = document.createElement('canvas'); o.width = w; o.height = Math.round(w * c.height / c.width);
        o.getContext('2d').drawImage(c, 0, 0, o.width, o.height);
        const u = o.toDataURL('image/png'); if (u.length < 40000) return u;
      }
      return '';
    }
  };
}
async function submit() {
  if (pad.empty()) return toast('서명을 먼저 해 주세요.');
  const b = $('#submit'); b.disabled = true; b.textContent = '제출하는 중…';
  // 많은 사람이 동시에 서명해 서버가 바쁠 때는 자동으로 몇 번 더 시도해요
  const img = pad.data(); let r, tries = 0, unsure = false;
  do {
    if (tries) { b.textContent = '다시 시도하는 중…'; await sleep(1500 * tries); }
    r = await api('sign', { token: TOKEN, trainingId: S.t.id, dept: S.dept, name: S.name, img });
    tries++;
    if (r.ok || !['net', 'server'].includes(r.err)) break;
    unsure = true; // 응답을 못 받았지만 서버에는 저장됐을 수도 있어요
  } while (tries < 4);
  if (!r.ok && r.err === 'dup' && unsure) r = { ok: true }; // 앞선 시도가 저장된 경우
  if (r.ok) { localStorage.setItem('esign_done_' + S.t.id, r.sid || '1'); return renderDone(); }
  b.disabled = false; b.textContent = '서명 제출하기';

    view(shell(`<div class="center"><h2>서명할 수 없어요</h2><p class="mute">${esc(r.msg)}</p></div><button class="btn" data-act="retry">확인</button>`));

}

function printPrev() {

  const pages = [];

    const members = []; let i = 0;
    for (const dept in g) g[dept].forEach(name => members.push({ id: 'm' + (++i), dept, name }));
    d = { cfg: { org: '서산중앙고등학교', sub: '', notice: '', caution: DEFAULT_CAUTION, color: '#1d4e5f', qrMode: 'fixed', deviceLimit: false }, members, trainings: [{ id: 't1', name: '교직원 정보보안 연수', date: ymd(new Date()), target: 'all', targetIds: [], from: '', to: '' }], signs: [], pin: '1234' };

  const ok = o => ({ ok: true, ...o }), no = (err, msg) => ({ ok: false, err, msg });
  const ids = t => d.members.filter(m => t.target === 'all' || (t.target === 'dept' && t.targetIds.includes(m.dept)) || (t.target === 'person' && t.targetIds.includes(m.id))).map(m => m.id);
  const st = t => t.date < today ? ['past', '종료된 연수예요'] : t.date > today ? ['early', kd(t.date) + '에 서명할 수 있어요'] : t.from && tm < t.from ? ['early', t.from + '부터 서명할 수 있어요'] : t.to && tm > t.to ? ['late', '서명 시간이 끝났어요'] : ['open', ''];
  const day = n => ymd(new Date(now.getTime() + n * 864e5)), uid = () => Math.random().toString(36).slice(2, 10);
  const rk = m => m.dept === '교장' ? 0 : m.dept === '교감' ? 1 : 2;
  const norm = s => String(s || '').normalize('NFC').replace(/\s+/g, '');
  if (a === 'init') {
    const c = d.cfg, mine = q.mine || {};
    return ok({
      tokenOk: true, cfg: { org: c.org, sub: c.sub, notice: c.notice, caution: c.caution, color: c.color, deviceLimit: c.deviceLimit },
      trainings: d.trainings.filter(t => t.date >= day(-3) && t.date <= day(30)).map(t => { const s = st(t); return { id: t.id, name: t.name, date: t.date, from: t.from, to: t.to, state: s[0], msg: s[1], depts: [...new Set(d.members.filter(m => ids(t).includes(m.id)).map(m => m.dept))], mine: !!(mine[t.id] && d.signs.some(x => x.id === mine[t.id])) }; })
        .sort((x, y) => (x.state === 'open' ? 0 : 1) - (y.state === 'open' ? 0 : 1) || x.date.localeCompare(y.date))
    });
  }
  if (a === 'check' || a === 'sign') {
    const t = d.trainings.find(x => x.id === q.trainingId);
    if (!t) return no('nf', '연수를 찾을 수 없어요.');
    const s = st(t); if (s[0] !== 'open') return no('closed', s[1]);
    const m = d.members.find(x => ids(t).includes(x.id) && norm(x.dept) === norm(q.dept) && norm(x.name) === norm(q.name));
    if (!m) return no('nomatch', NOMATCH);
    if ((d.reasons || []).some(x => x.trainingId === t.id && x.memberId === m.id)) return no('reason', '관리자가 사유(출장·연가 등)로 처리한 연수예요. 문의해 주세요.');
    if (d.signs.some(x => x.trainingId === t.id && x.memberId === m.id)) return no('dup', '이미 서명한 연수예요.');
    if (a === 'check') return ok();
    const sid = uid(); d.signs.push({ id: sid, trainingId: t.id, memberId: m.id, at: `${today} ${tm}:00`, img: q.img }); dput(d); return ok({ sid });
  }
  if (q.pin !== d.pin) return no('pin', '비밀번호가 맞지 않아요.');
  switch (a) {
    case 'login': return ok();
    case 'load': return ok({ ver: 9, cfg: d.cfg, defaultPin: d.pin === '1234', tokens: { fixed: 'demo', daily: 'demo' }, members: d.members, trainings: d.trainings.map(t => ({ ...t, ids: ids(t) })), signs: d.signs.map(({ img, ...s }) => s) });
    case 'getSigns': return ok({ signs: d.signs.filter(s => s.trainingId === q.trainingId), reasons: (d.reasons || []).filter(x => x.trainingId === q.trainingId) });
    case 'setReasons': { d.reasons = d.reasons || []; const t = d.trainings.find(x => x.id === q.trainingId); (q.items || []).forEach(it => { const rs = String(it.reason || '').trim().slice(0, 8), i = d.reasons.findIndex(x => x.trainingId === q.trainingId && x.memberId === it.memberId); if (!ids(t).includes(it.memberId) || d.signs.some(s => s.trainingId === q.trainingId && s.memberId === it.memberId)) return; if (i >= 0 && !rs) d.reasons.splice(i, 1); else if (i >= 0) d.reasons[i].reason = rs; else if (rs) d.reasons.push({ id: uid(), trainingId: q.trainingId, memberId: it.memberId, reason: rs }); }); break; }
    case 'saveTraining': { const t = { ...q.t }, i = d.trainings.findIndex(x => x.id === t.id); if (i >= 0) d.trainings[i] = t; else { t.id = uid(); d.trainings.push(t); } break; }
    case 'delTraining': d.reasons = (d.reasons || []).filter(x => x.trainingId !== q.id); d.trainings = d.trainings.filter(t => t.id !== q.id); d.signs = d.signs.filter(s => s.trainingId !== q.id); break;
    case 'addMembers': { let n = 0; q.list.forEach(m => { if (!d.members.some(x => x.dept === m.dept && x.name === m.name)) { d.members.push({ id: uid(), dept: m.dept, name: m.name }); n++; } }); if (n) d.members.sort((a, b) => rk(a) - rk(b) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)); dput(d); return ok({ added: n }); }
    case 'sortMembers': { d.members.sort((a, b) => rk(a) - rk(b) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)); break; }
    case 'delMember': d.members = d.members.filter(m => m.id !== q.id); d.signs = d.signs.filter(s => s.memberId !== q.id); break;
    case 'delSign': d.signs = d.signs.filter(s => s.id !== q.id); break;
    case 'saveCfg': Object.assign(d.cfg, q.cfg); break;
    case 'setPin': d.pin = q.newPin; break;
    default: return no('action', '알 수 없는 요청이에요.');
  }
  dput(d); return ok();
}

setInterval(tick, 1000);
start();
</script>
